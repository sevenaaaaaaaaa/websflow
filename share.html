<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebsFlow 分享页面</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f1f5f9; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .share-loading { color: #64748b; font-size: 14px; }
  .share-error { text-align: center; color: #64748b; padding: 40px 20px; }
  .share-error__icon { font-size: 44px; margin-bottom: 12px; }
  .share-error__btn { display: inline-block; margin-top: 16px; padding: 9px 18px; background: #4f46e5; color: #fff; border-radius: 10px; text-decoration: none; font-size: 13px; font-weight: 600; }
  .share-footer { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 90; }
  .share-footer a { color: #94a3b8; font-size: 11.5px; text-decoration: none; background: rgba(255,255,255,.85); padding: 5px 12px; border-radius: 999px; box-shadow: 0 2px 10px rgba(15,23,42,.08); }
  .share-footer a:hover { color: #4f46e5; }
</style>
</head>
<body>
<div class="share-loading" id="shareLoading">⏳ 正在加载页面…</div>
<script src="js/schema.js?v=4.38.0" data-cfasync="false"></script>
<script src="js/themes.js?v=4.38.0" data-cfasync="false"></script>
<script src="js/runtime-css.js?v=4.38.0" data-cfasync="false"></script>
<script src="js/render.js?v=4.38.0" data-cfasync="false"></script>
<script src="js/variants.js?v=4.38.0" data-cfasync="false"></script>
<script src="js/variants-batch-1.js?v=4.38.0" data-cfasync="false"></script>
<script src="js/variants-batch-2.js?v=4.38.0" data-cfasync="false"></script>
<script src="js/variants-batch-3.js?v=4.38.0" data-cfasync="false"></script>
<script src="js/variants-batch-4.js?v=4.38.0" data-cfasync="false"></script>
<script src="js/variants-batch-5.js?v=4.38.0" data-cfasync="false"></script>

<script src="js/api.js?v=4.38.0" data-cfasync="false"></script>
<script>
(function () {
  "use strict";
  var m = location.search.match(/[?&]t=([\w]+)/) || location.hash.match(/^#t=([\w]+)/);
  var loading = document.getElementById("shareLoading");

  if (!m) {
    loading.innerHTML = '<div class="share-error"><div class="share-error__icon">🔗</div><p>缺少分享参数</p><a class="share-error__btn" href="./">打开 WebsFlow 编辑器</a></div>';
    return;
  }

  WF.apiGetSharedProject(m[1]).then(function (project) {
    var p = {
      name: project.name,
      mode: project.mode,
      theme: (project.data && project.data.theme) || {},
      global: (project.data && project.data.global) || {},
      blocks: (project.data && project.data.blocks) || [],
    };
    document.body.innerHTML = WF.renderProject(p, { context: "live" });
    var style = document.createElement("style");
    style.textContent = WF.runtimeCSS;
    document.head.appendChild(style);
    if (WF.runtimeFn) WF.runtimeFn(document);

    // 页脚署名
    var foot = document.createElement("div");
    foot.className = "share-footer";
    foot.innerHTML = '<a href="./" target="_blank" rel="noopener">🧱 由 WebsFlow 魔块搭建</a>';
    document.body.appendChild(foot);
  }).catch(function () {
    loading.innerHTML = '<div class="share-error"><div class="share-error__icon">🫥</div><p>页面不存在或作者已取消分享</p><a class="share-error__btn" href="./">打开 WebsFlow 编辑器</a></div>';
  });
})();
</script>
</body>
</html>

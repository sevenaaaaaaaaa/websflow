    <rect x="120" y="176" width="560" height="482" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="120" y="176" width="560" height="44" rx="14" fill="#f1f5f9"/>
    <rect x="144" y="192" width="70" height="12" rx="6" fill="#334155"/>
    <rect x="470" y="190" width="46" height="16" rx="8" fill="#cbd5e1"/>
    <rect x="524" y="190" width="46" height="16" rx="8" fill="#cbd5e1"/>
    <rect x="578" y="190" width="78" height="16" rx="8" fill="url(#accent)"/>


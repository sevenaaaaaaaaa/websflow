    <text x="236" y="377" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC',sans-serif" font-size="14" fill="#ffffff">预约免费诊断</text>
    <rect x="332" y="352" width="128" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="356" y="368" width="80" height="8" rx="4" fill="#94a3b8"/>

    <rect x="152" y="418" width="496" height="1" fill="#eef2f7"/>
    <g>

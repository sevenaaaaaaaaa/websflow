      <rect x="168" y="458" width="28" height="28" rx="8" fill="#e0e7ff"/>
      <rect x="168" y="498" width="96" height="10" rx="5" fill="#94a3b8"/>
      <rect x="168" y="516" width="120" height="8" rx="4" fill="#e2e8f0"/>
    </g>
    <g>
      <rect x="324" y="440" width="152" height="104" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="340" y="458" width="28" height="28" rx="8" fill="#ede9fe"/>
      <rect x="340" y="498" width="96" height="10" rx="5" fill="#94a3b8"/>
      <rect x="340" y="516" width="120" height="8" rx="4" fill="#e2e8f0"/>
    </g>
    <g>
      <rect x="496" y="440" width="152" height="104" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="512" y="458" width="28" height="28" rx="8" fill="#dcfce7"/>
      <rect x="512" y="498" width="96" height="10" rx="5" fill="#94a3b8"/>
      <rect x="512" y="516" width="120" height="8" rx="4" fill="#e2e8f0"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-label="落地页工场：出页 + 转化看板">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="0.55" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c7d2fe" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
    <filter id="card" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#312e81" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#312e81" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="860" rx="28" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="860" rx="28" fill="url(#grid)" opacity="0.5"/>
  <circle cx="1080" cy="140" r="180" fill="#818cf8" opacity="0.16"/>
  <circle cx="150" cy="740" r="150" fill="#a78bfa" opacity="0.14"/>

  <!-- 浏览器窗口 -->
  <g filter="url(#card)">
    <rect x="86" y="92" width="1028" height="600" rx="20" fill="#ffffff"/>
    <rect x="86" y="92" width="1028" height="54" rx="20" fill="#f8fafc"/>
    <rect x="86" y="126" width="1028" height="20" fill="#f8fafc"/>
    <circle cx="120" cy="119" r="7" fill="#fca5a5"/>

    <rect x="742" y="604" width="336" height="34" rx="10" fill="#f1f5f9"/>
    <circle cx="760" cy="621" r="7" fill="#22c55e"/>
    <text x="776" y="626" font-family="ui-sans-serif,-apple-system,'PingFang SC',sans-serif" font-size="13" fill="#334155">A/B 已自动择优（显著性 p&lt;0.05）</text>
  </g>

  <!-- 角落徽标 -->
  <g filter="url(#soft)">
    <rect x="120" y="700" width="248" height="72" rx="16" fill="#ffffff"/>
    <circle cx="156" cy="736" r="20" fill="#eef2ff"/>
    <text x="156" y="742" text-anchor="middle" font-size="18">⚡</text>
    <text x="188" y="730" font-family="ui-sans-serif,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#0f172a">5 分钟出页</text>
    <text x="188" y="752" font-family="ui-sans-serif,-apple-system,'PingFang SC',sans-serif" font-size="12.5" fill="#64748b">模块化拼装 · 无需开发</text>
  </g>
  <g filter="url(#soft)">
    <rect x="392" y="700" width="264" height="72" rx="16" fill="#ffffff"/>
    <circle cx="428" cy="736" r="20" fill="#f5f3ff"/>
    <text x="428" y="742" text-anchor="middle" font-size="18">🎯</text>
    <text x="460" y="730" font-family="ui-sans-serif,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#0f172a">千人对千面</text>
    <text x="460" y="752" font-family="ui-sans-serif,-apple-system,'PingFang SC',sans-serif" font-size="12.5" fill="#64748b">按来源/登录态换内容</text>
  </g>
  <g filter="url(#soft)">
    <rect x="680" y="700" width="264" height="72" rx="16" fill="#ffffff"/>
    <circle cx="716" cy="736" r="20" fill="#ecfdf5"/>
    <text x="716" y="742" text-anchor="middle" font-size="18">🔗</text>
    <text x="748" y="730" font-family="ui-sans-serif,-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#0f172a">跨系统打通</text>
    <text x="748" y="752" font-family="ui-sans-serif,-apple-system,'PingFang SC',sans-serif" font-size="12.5" fill="#64748b">线索→OpenFlow·收款→PayFlow</text>

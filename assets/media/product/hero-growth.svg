    <circle cx="168" cy="119" r="7" fill="#86efac"/>
    <rect x="200" y="106" width="420" height="26" rx="13" fill="#eef2f7"/>
    <text x="216" y="124" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#64748b">nownexts.com/webflow/p/2a94240d8a58</text>
    <rect x="1000" y="104" width="94" height="30" rx="15" fill="url(#accent)"/>
    <text x="1047" y="124" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC',sans-serif" font-size="13" fill="#ffffff">已发布</text>
  </g>


    <text x="742" y="300" font-family="ui-sans-serif,-apple-system,'PingFang SC',sans-serif" font-size="40" font-weight="700" fill="#ffffff">12.4%</text>
    <rect x="884" y="272" width="96" height="28" rx="14" fill="#065f46"/>
    <text x="932" y="291" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="13" fill="#6ee7b7">+3.5× ↑</text>

    <path d="M742 452 L794 430 L846 438 L898 396 L950 372 L1002 336 L1054 316 L1078 300" fill="none" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M742 452 L794 430 L846 438 L898 396 L950 372 L1002 336 L1054 316 L1078 300 L1078 470 L742 470 Z" fill="url(#chart)"/>
    <circle cx="1078" cy="300" r="6" fill="#a5b4fc"/>

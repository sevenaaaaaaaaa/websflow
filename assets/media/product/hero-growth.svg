      <text x="888" y="552" font-size="13" fill="#64748b">点击</text>
      <text x="888" y="584" font-size="26" font-weight="700" fill="#0f172a">2,261</text>
      <text x="1034" y="552" font-size="13" fill="#64748b">线索</text>
      <text x="1034" y="584" font-size="26" font-weight="700" fill="#0f172a">283</text>

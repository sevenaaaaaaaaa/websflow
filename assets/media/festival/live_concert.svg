<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#170f33"/>
      <stop offset=".6" stop-color="#3d1852"/>
      <stop offset="1" stop-color="#6d1f4f"/>
    </linearGradient>
    <radialGradient id="spot" cx=".5" cy="0" r="1">
      <stop offset="0" stop-color="#ffd9f0" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffd9f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eq" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff5f9e"/>
      <stop offset="1" stop-color="#ffb56b"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#hall)"/>

  <!-- 追光 -->
  <polygon points="360,0 40,1000 680,1000" fill="url(#spot)" opacity=".5"/>
  <polygon points="1240,0 920,1000 1560,1000" fill="url(#spot)" opacity=".38"/>

  <!-- 均衡器律动条(舞台背景) -->
  <g fill="url(#eq)">
    <rect x="120" y="560" width="34" height="180" rx="17" opacity=".55"/>
    <rect x="182" y="500" width="34" height="240" rx="17" opacity=".65"/>
    <rect x="244" y="590" width="34" height="150" rx="17" opacity=".5"/>
    <rect x="306" y="460" width="34" height="280" rx="17" opacity=".75"/>
    <rect x="368" y="540" width="34" height="200" rx="17" opacity=".6"/>
    <rect x="1198" y="540" width="34" height="200" rx="17" opacity=".6"/>
    <rect x="1260" y="460" width="34" height="280" rx="17" opacity=".75"/>
    <rect x="1322" y="590" width="34" height="150" rx="17" opacity=".5"/>
    <rect x="1384" y="500" width="34" height="240" rx="17" opacity=".65"/>
    <rect x="1446" y="560" width="34" height="180" rx="17" opacity=".55"/>
  </g>

  <!-- 吉他手剪影 -->
  <g fill="#120b28">
    <circle cx="800" cy="330" r="52"/>
    <path d="M770 396 q30 -18 60 0 l16 190 q-46 24 -92 0 z"/>
    <!-- 吉他 -->
    <ellipse cx="872" cy="520" rx="66" ry="88" transform="rotate(-18 872 520)"/>
    <rect x="906" y="380" width="20" height="140" rx="10" transform="rotate(-18 916 450)"/>
    <circle cx="872" cy="522" r="26" fill="#ff7fae" opacity=".9"/>
  </g>
  <!-- 琴光 -->
  <circle cx="872" cy="522" r="86" fill="#ff7fae" opacity=".22"/>

  <!-- 音响 -->
  <g fill="#221240">
    <rect x="430" y="600" width="120" height="200" rx="12"/>
    <rect x="1050" y="600" width="120" height="200" rx="12"/>
  </g>
  <g fill="#3b1f5e">
    <circle cx="490" cy="660" r="30"/><circle cx="490" cy="740" r="22"/>
    <circle cx="1110" cy="660" r="30"/><circle cx="1110" cy="740" r="22"/>
  </g>

  <!-- 舞台地板反光 -->
  <rect x="0" y="820" width="1600" height="180" fill="#1c0f38"/>
  <ellipse cx="800" cy="860" rx="560" ry="70" fill="#ff5f9e" opacity=".12"/>

  <!-- 前排观众举起的手 -->
  <g stroke="#120b28" stroke-width="16" stroke-linecap="round">
    <line x1="200" y1="1000" x2="238" y2="900"/>
    <line x1="330" y1="1000" x2="318" y2="892"/>
    <line x1="540" y1="1000" x2="576" y2="908"/>
    <line x1="1010" y1="1000" x2="986" y2="902"/>
    <line x1="1240" y1="1000" x2="1276" y2="910"/>
    <line x1="1420" y1="1000" x2="1404" y2="896"/>
  </g>
</svg>

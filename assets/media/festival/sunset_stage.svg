<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2a6b"/>
      <stop offset=".42" stop-color="#c95e8e"/>
      <stop offset=".72" stop-color="#ff9e6b"/>
      <stop offset="1" stop-color="#ffc98a"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3c9"/>
      <stop offset=".65" stop-color="#ffce7a"/>
      <stop offset="1" stop-color="#ffb26b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e98a6e"/>
      <stop offset="1" stop-color="#8f5a8f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#dusk)"/>

  <!-- 落日 -->
  <circle cx="800" cy="620" r="240" fill="url(#sun)"/>
  <circle cx="800" cy="620" r="110" fill="#ffe9ae"/>

  <!-- 海平线与海面 -->
  <rect x="0" y="660" width="1600" height="340" fill="url(#sea)"/>
  <g stroke="#ffd9a8" stroke-linecap="round">
    <line x1="620" y1="700" x2="980" y2="700" stroke-width="8" opacity=".8"/>
    <line x1="540" y1="740" x2="1060" y2="740" stroke-width="6" opacity=".55"/>
    <line x1="660" y1="782" x2="940" y2="782" stroke-width="6" opacity=".45"/>
    <line x1="480" y1="828" x2="1120" y2="828" stroke-width="8" opacity=".35"/>
    <line x1="600" y1="880" x2="1000" y2="880" stroke-width="6" opacity=".3"/>
  </g>

  <!-- 远处帆船 -->
  <g fill="#3c2f63">
    <polygon points="1210,636 1210,596 1252,636"/>
    <rect x="1206" y="636" width="52" height="8" rx="4"/>
    <polygon points="340,650 340,622 368,650"/>
    <rect x="336" y="650" width="36" height="6" rx="3"/>
  </g>

  <!-- 舞台剪影 -->
  <g fill="#241d4f">
    <rect x="560" y="470" width="480" height="26" rx="13"/>
    <rect x="596" y="496" width="40" height="140"/>
    <rect x="964" y="496" width="40" height="140"/>
    <rect x="640" y="522" width="320" height="90" rx="8" fill="#2c2560"/>
    <rect x="668" y="548" width="264" height="8" rx="4" fill="#ff9e6b" opacity=".85"/>
    <rect x="668" y="572" width="180" height="8" rx="4" fill="#ffd9a8" opacity=".7"/>
  </g>

  <!-- 飞鸟 -->
  <g stroke="#3c2f63" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M300 260 q22 -26 44 0 M344 260 q22 -26 44 0"/>
    <path d="M1240 210 q18 -22 36 0 M1276 210 q18 -22 36 0"/>
    <path d="M540 180 q16 -20 32 0"/>
  </g>

  <!-- 前景人群与旗子 -->
  <g fill="#1c1747">
    <circle cx="220" cy="920" r="42"/><rect x="178" y="920" width="84" height="80" rx="26"/>
    <circle cx="420" cy="945" r="36"/><rect x="384" y="945" width="72" height="55" rx="22"/>
    <circle cx="1180" cy="940" r="38"/><rect x="1142" y="940" width="76" height="60" rx="24"/>
    <circle cx="1400" cy="915" r="44"/><rect x="1356" y="915" width="88" height="85" rx="28"/>
  </g>
  <g stroke="#1c1747" stroke-width="6" stroke-linecap="round">
    <line x1="420" y1="880" x2="420" y2="700"/>
    <line x1="1180" y1="872" x2="1180" y2="712"/>
  </g>
  <polygon points="424,704 500,726 424,750" fill="#ff8f6b"/>
  <polygon points="1184,716 1256,736 1184,758" fill="#c95e8e"/>
</svg>

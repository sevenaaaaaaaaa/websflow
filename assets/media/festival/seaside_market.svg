<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="noon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd8ef"/>
      <stop offset=".6" stop-color="#c9ecf4"/>
      <stop offset="1" stop-color="#fdf3d9"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb7c9"/>
      <stop offset="1" stop-color="#3f8ba8"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#noon)"/>

  <!-- 太阳与云 -->
  <circle cx="1320" cy="140" r="70" fill="#ffe9a8"/>
  <g fill="#ffffff" opacity=".9">
    <ellipse cx="300" cy="150" rx="120" ry="34"/>
    <ellipse cx="380" cy="130" rx="80" ry="26"/>
    <ellipse cx="900" cy="100" rx="100" ry="28"/>
  </g>

  <!-- 海 -->
  <rect x="0" y="520" width="1600" height="260" fill="url(#water)"/>
  <g stroke="#bfe9f2" stroke-width="6" stroke-linecap="round" opacity=".7">
    <line x1="140" y1="580" x2="360" y2="580"/><line x1="1200" y1="600" x2="1420" y2="600"/>
    <line x1="620" y1="640" x2="880" y2="640"/><line x1="980" y1="700" x2="1180" y2="700"/>
  </g>
  <!-- 帆船 -->
  <g>
    <polygon points="520,470 520,420 566,470" fill="#f7f7fb"/>
    <rect x="512" y="470" width="60" height="10" rx="5" fill="#2f5d76"/>
    <polygon points="1060,492 1060,458 1096,492" fill="#f7f7fb"/>
    <rect x="1054" y="492" width="48" height="8" rx="4" fill="#2f5d76"/>
  </g>
  <!-- 沙滩 -->
  <path d="M0 760 q400 -60 800 -20 q440 36 800 -10 L1600 1000 L0 1000 z" fill="#f4dfae"/>

  <!-- 彩旗 -->
  <g stroke="#8a6b4f" stroke-width="4" fill="none">
    <path d="M60 120 q780 180 1480 0"/>
  </g>
  <g>
    <polygon points="180,150 220,158 188,184" fill="#ff8f8f"/>
    <polygon points="420,206 460,212 430,238" fill="#ffd66b"/>
    <polygon points="660,246 700,250 672,276" fill="#7fd8c3"/>
    <polygon points="900,256 940,258 914,284" fill="#ff9fd0"/>
    <polygon points="1140,220 1180,222 1154,248" fill="#8faeff"/>
    <polygon points="1360,166 1400,166 1376,192" fill="#bfa0ff"/>
  </g>

  <!-- 市集摊位 ×3 -->
  <g>
    <!-- 摊位 1 -->
    <rect x="150" y="700" width="300" height="180" rx="10" fill="#e8b06b"/>
    <polygon points="130,700 470,700 440,636 160,636" fill="#ff8f8f"/>
    <path d="M160 668 h280 M155 652 h290" stroke="#c95f5f" stroke-width="10"/>
    <rect x="196" y="760" width="90" height="70" rx="8" fill="#fff3dd"/>
    <rect x="316" y="760" width="90" height="70" rx="8" fill="#fff3dd"/>
    <!-- 摊位 2 -->
    <rect x="620" y="710" width="300" height="170" rx="10" fill="#e8b06b"/>
    <polygon points="600,710 940,710 910,646 630,646" fill="#7fd8c3"/>
    <path d="M630 678 h280 M625 662 h290" stroke="#3f9c8a" stroke-width="10"/>
    <rect x="666" y="770" width="90" height="60" rx="8" fill="#fff3dd"/>
    <rect x="786" y="770" width="90" height="60" rx="8" fill="#fff3dd"/>
    <!-- 摊位 3 -->
    <rect x="1090" y="700" width="300" height="180" rx="10" fill="#e8b06b"/>
    <polygon points="1070,700 1410,700 1380,636 1100,636" fill="#8faeff"/>
    <path d="M1100 668 h280 M1095 652 h290" stroke="#5f74c9" stroke-width="10"/>
    <rect x="1136" y="760" width="90" height="70" rx="8" fill="#fff3dd"/>
    <rect x="1256" y="760" width="90" height="70" rx="8" fill="#fff3dd"/>
  </g>

  <!-- 游人剪影 -->
  <g fill="#6b5138">
    <circle cx="530" cy="880" r="26"/><rect x="506" y="896" width="48" height="70" rx="16"/>
    <circle cx="1000" cy="900" r="24"/><rect x="978" y="914" width="44" height="60" rx="15"/>
    <circle cx="1480" cy="890" r="26"/><rect x="1456" y="906" width="48" height="66" rx="16"/>
  </g>
  <!-- 气球 -->
  <g>
    <line x1="560" y1="760" x2="574" y2="700" stroke="#6b5138" stroke-width="4"/>
    <circle cx="578" cy="690" r="20" fill="#ff8f8f"/>
    <line x1="1030" y1="774" x2="1046" y2="716" stroke="#6b5138" stroke-width="4"/>
    <circle cx="1050" cy="706" r="18" fill="#ffd66b"/>
  </g>
</svg>

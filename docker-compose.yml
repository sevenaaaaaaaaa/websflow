# WebsFlow 魔块 · 单容器编排
# 用法: docker compose up -d  →  http://服务器IP:3001/webflow/
services:
  websflow:
    build: .
    image: websflow:latest
    container_name: websflow
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - websflow-data:/data
      # 可选:把收款/邮件等运行时配置放在宿主机(文件不存在也能正常启动)
      # - ./api/payflow-config.json:/app/api/payflow-config.json:ro
    environment:
      # JWT 签名密钥:务必改成随机长字符串(改后所有登录态失效,需重新登录)
      - JWT_SECRET=${JWT_SECRET:-change-me-to-a-long-random-string}
      # TZ=Asia/Shanghai

volumes:
  websflow-data:
